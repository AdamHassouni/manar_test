# Fanar Phase 0 — local dev stack. Brings up the backing services the adapters target.
# Not required for the stdlib core tests; needed when running the FastAPI app end-to-end.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fanar
      POSTGRES_PASSWORD: fanar
      POSTGRES_DB: fanar
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--https-port=8443"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin   # dev only
    ports: ["8443:8443"]

  vault:
    image: hashicorp/vault:1.17
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root     # dev only
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]

volumes:
  pgdata:
