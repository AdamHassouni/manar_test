name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: fanar-platform

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (project + dev tools)
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format check) — advisory in Phase 0
        run: ruff format --check src tests
        continue-on-error: true
      - name: Mypy — advisory in Phase 0
        run: mypy src/fanar
        continue-on-error: true
      - name: Tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (project + scan tools)
        run: pip install -e . pip-audit cyclonedx-bom
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --strict
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: fanar-platform/sbom.cdx.json
